<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Sound List</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/ui.css">
</head>

<body>
    <!-- Particle background canvas — drawn behind everything via CSS -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <h1>Emote Sounds</h1>

        <!-- Migration Warning Banner — remove once R2 migration is complete -->
        <div class="warning-banner">
            <span class="warning-icon">⚠️</span>
            <span>Some sounds are currently unavailable while files are being migrated to a new host. This will be resolved soon!</span>
        </div>

        <!-- Dynamic list — populated by display.js -->
        <div id="list"></div>

        <!-- Contact -->
        <div style="text-align:center; margin-top:40px;">
            <a href="https://twitch.tv/windowsben" target="_blank" class="contact-card">
                <!-- TODO: move this image to R2 -->
                <img src="https://files.catbox.moe/c65dyt.png" alt="Contact Me"
                     style="width:120px; height:auto; border-radius:12px; cursor:pointer;">
            </a>
        </div>
    </div>

    <!-- type="module" enables ES import/export and defers execution automatically -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
